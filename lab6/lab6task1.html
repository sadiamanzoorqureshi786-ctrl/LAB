<!DOCTYPE html>
<html>
<head>
    <title>Lab 06 - Task 1: Sum of Numbers</title>
</head>
<body>

    <h2>Sum of Numbers Until 0 is Entered</h2>
    <p>Click the button below. Enter numbers one at a time; enter 0 to stop and see the total sum.</p>

    <button onclick="calculateSum()">Start</button>
    <p id="result"></p>

    <script>
        function calculateSum() {
            var sum = 0;
            var num;

            while (true) {
                num = prompt("Enter a number (0 to end):", "0");
                num = Number(num);

                if (num === 0) {
                    break;
                }
                sum += num;
            }

            document.getElementById("result").innerHTML =
                "The sum of the entered numbers is: " + sum;
        }
    </script>

</body>
</html>
