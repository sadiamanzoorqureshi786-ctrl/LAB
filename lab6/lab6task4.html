<!DOCTYPE html>
<html>
<head>
    <title>Lab 06 - Task 4: Validated Signup Form</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; }
        .container {
            width: 350px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #04AA6D;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .error {
            color: red;
            font-size: 13px;
            margin: -10px 0 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sign Up</h1>
        <p>Please fill in this form to create an account.</p>
        <hr>

        <form onsubmit="return validateForm()">
            <label for="email"><b>Email</b></label>
            <input type="text" id="email" name="email" placeholder="Enter Email">
            <div class="error" id="emailError"></div>

            <label for="psw"><b>Password</b></label>
            <input type="password" id="psw" name="psw" placeholder="Enter Password">
            <div class="error" id="pswError"></div>

            <label for="psw-repeat"><b>Repeat Password</b></label>
            <input type="password" id="psw-repeat" name="psw-repeat" placeholder="Repeat Password">
            <div class="error" id="repeatError"></div>

            <button type="submit">Register</button>
        </form>
    </div>

    <script>
        function validateForm() {
            var email = document.getElementById("email").value.trim();
            var psw = document.getElementById("psw").value;
            var pswRepeat = document.getElementById("psw-repeat").value;

            var emailError = document.getElementById("emailError");
            var pswError = document.getElementById("pswError");
            var repeatError = document.getElementById("repeatError");

            emailError.innerHTML = "";
            pswError.innerHTML = "";
            repeatError.innerHTML = "";

            var isValid = true;
            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {
                emailError.innerHTML = "Email is required.";
                isValid = false;
            } else if (!emailPattern.test(email)) {
                emailError.innerHTML = "Please enter a valid email address.";
                isValid = false;
            }

            if (psw === "") {
                pswError.innerHTML = "Password is required.";
                isValid = false;
            } else if (psw.length < 6) {
                pswError.innerHTML = "Password must be at least 6 characters.";
                isValid = false;
            }

            if (pswRepeat === "") {
                repeatError.innerHTML = "Please repeat your password.";
                isValid = false;
            } else if (psw !== pswRepeat) {
                repeatError.innerHTML = "Passwords do not match.";
                isValid = false;
            }

            if (isValid) {
                alert("Registration successful!");
            }

            return false;
        }
    </script>

</body>
</html>
